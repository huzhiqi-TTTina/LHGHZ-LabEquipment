server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: lab-equipment-system
  #时间格式
  jackson:
      date-format: yyyy-MM-dd HH:mm:ss
      time-zone: GMT+8
      serialization:
        write-dates-as-timestamps: false # 序列化时也转为字符串

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://81.70.40.138:3306/lab_equipment_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: lab_equipment_db
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lab.equipment.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: lab-equipment-system-secret-key-2024-must-be-at-least-256-bits-long
  expiration: 86400000  # 24小时，单位：毫秒
  header: Authorization
  prefix: Bearer

# 文件上传路径
file:
  upload:
    path: D:/lab-equipment-uploads/
    url-prefix: /uploads/

# 二维码配置
qr:
  code:
    base.url: http://192.168.50.76:8080  # 已配置为当前电脑IP，手机热点环境
    # - 公网访问：https://your-domain.com

# AI服务配置（通义千问 Qwen 模型）
ai:
  provider: qwen  # 通义千问
  api-url: https://maas-coding-api.cn-huabei-1.xf-yun.com/v2/chat/completions  # 讯飞平台OpenAI兼容端点
  api-key: c97397f26e7bf9ab6dd95eff55c2fd8f:ODVjMzRlZTUwZDFjM2Q4NDZmNWVmNmJl
  model: astron-code-latest  # 讯飞平台modelId（平台显示Qwen3.6-35B-A3B，但调用时用此ID）
  max-tokens: 32768  # 建议32k以下
  temperature: 0.7  # 控制随机性（0-1）
  timeout: 120  # 超时时间（秒）

# 讯飞平台模型切换说明：
# 1. 访问 https://maas.xfyun.cn/packageSubscription
# 2. 点击"配置模型"按钮
# 3. 选择 Qwen3.6-35B-A3B（或其他Qwen模型）
# 4. 1-3分钟后生效

# 智谱AI配置（备用）
# zhipu:
#   ai:
#     api-key: YOUR_ZHIPU_API_KEY
#     api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
#     model: glm-4.7-flash

# 系统配置
system:
  borrow:
    max-days: 7
  maintenance:
    reminder-days: 7
  overdue:
    reminder-days: 3

# 日志配置
logging:
  level:
    com.lab.equipment: debug
    org.springframework.security: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/lab-equipment.log

